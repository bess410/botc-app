<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Random Roll | Генератор ролей для игры</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #1a2a3a 0%, #0f1a24 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 48px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 1100px;
            padding: 28px 24px 36px;
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: #1e2f3c;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .sub {
            color: #4a6272;
            border-left: 4px solid #c44536;
            padding-left: 14px;
            margin: 12px 0 24px 0;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-weight: 600;
            color: #1f3e4b;
            margin-bottom: 8px;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        input {
            flex: 2;
            min-width: 140px;
            padding: 14px 18px;
            font-size: 1.2rem;
            font-weight: 600;
            border: 2px solid #cbdbe0;
            border-radius: 44px;
            background: white;
            text-align: center;
        }

        button {
            background: #2c5a6e;
            border: none;
            padding: 14px 28px;
            border-radius: 44px;
            font-weight: bold;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #c44536;
            transform: scale(0.97);
        }

        .random-btn {
            background: #7e5a3c;
            margin-top: 8px;
            width: 100%;
        }

        .random-btn:hover {
            background: #a06e48;
        }

        .result-card {
            background: #f8fafc;
            border-radius: 36px;
            margin-top: 28px;
            padding: 20px;
        }

        .section {
            margin-bottom: 24px;
            border-bottom: 1px solid #dce5ec;
            padding-bottom: 16px;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .roles-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            flex-direction: column;
        }

        .role-tag {
            background: white;
            border-radius: 60px;
            padding: 6px 16px;
            border: 1px solid #cbdbe0;
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .drunkard-tag {
            background: #fff3e0;
            border-color: #e6a017;
            color: #8a6100;
            font-weight: 600;
        }

        .citizen-card {
            background: white;
            border-radius: 20px;
            padding: 12px;
            border: 1px solid #e2edf2;
            width: 100%;
            margin-bottom: 12px;
        }

        .citizen-name {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .citizen-effect {
            background: #f0f4fa;
            border-radius: 16px;
            padding: 8px 12px;
            font-size: 0.85rem;
            color: #2c5a6e;
            margin-top: 6px;
            border-left: 3px solid #c44536;
        }

        .citizens-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .demon-tokens {
            background: #1e2f3c;
            color: white;
            border-radius: 28px;
            padding: 16px;
            margin-top: 16px;
        }

        .demon-tokens-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tokens-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .token {
            background: #2c5a6e;
            border-radius: 60px;
            padding: 8px 20px;
            font-size: 1rem;
            font-weight: 600;
        }

        footer {
            margin-top: 24px;
            text-align: center;
            font-size: 0.75rem;
            color: #6f8b9c;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>🎲 Генератор ролей</h1>
    <div class="sub">Демон всегда Чёрт. Прачка, Библиотекарь, Сыщик и Гадалка получают случайные цели</div>

    <div class="form-group">
        <label>👥 Количество игроков (5–15)</label>
        <div class="input-wrapper">
            <input type="number" id="playersInput" min="5" max="15" value="10">
            <button id="generateBtn">✨ Сгенерировать случайный состав</button>
        </div>
        <button id="randomBtn" class="random-btn">🎲 Ещё случайный состав</button>
    </div>

    <div id="resultContainer" style="display: none;">
        <div class="result-card">
            <div class="section">
                <div class="section-title">👹 Демон</div>
                <div id="demonList" class="roles-list"></div>
            </div>
            <div class="section">
                <div class="section-title">🔮 Прислужник</div>
                <div id="servantList" class="roles-list"></div>
            </div>
            <div class="section">
                <div class="section-title">🗡️ Изгои</div>
                <div id="outcastList" class="roles-list"></div>
            </div>
            <div class="section">
                <div class="section-title">🏘️ Горожане</div>
                <div id="citizenList" class="citizens-list"></div>
            </div>
            <div class="demon-tokens" id="demonTokensSection">
                <div class="demon-tokens-title">👹 Чёрту показываются жетоны (не участвуют в игре):</div>
                <div id="demonTokens" class="tokens-list"></div>
            </div>
        </div>
    </div>
    <footer>🎭 Пьяница не может быть выбран для способностей Прачки, Библиотекаря и Сыщика.</footer>
</div>

<script>
    // --------------------------------------------------------------
    // 1. БАЗОВОЕ РАСПРЕДЕЛЕНИЕ
    // --------------------------------------------------------------
    const ROLE_COUNTS = {
        5:  { citizens: 3, outcasts: 0, servants: 1, demon: 1 },
        6:  { citizens: 3, outcasts: 1, servants: 1, demon: 1 },
        7:  { citizens: 5, outcasts: 0, servants: 1, demon: 1 },
        8:  { citizens: 5, outcasts: 1, servants: 1, demon: 1 },
        9:  { citizens: 5, outcasts: 2, servants: 1, demon: 1 },
        10: { citizens: 7, outcasts: 0, servants: 2, demon: 1 },
        11: { citizens: 7, outcasts: 1, servants: 2, demon: 1 },
        12: { citizens: 7, outcasts: 2, servants: 2, demon: 1 },
        13: { citizens: 9, outcasts: 0, servants: 3, demon: 1 },
        14: { citizens: 9, outcasts: 1, servants: 3, demon: 1 },
        15: { citizens: 9, outcasts: 2, servants: 3, demon: 1 }
    };

    // --------------------------------------------------------------
    // 2. ПУЛЫ РОЛЕЙ
    // --------------------------------------------------------------
    const DEMON = {id: "demon", name: "👹 Чёрт"};

    let SERVANT_POOL = [
        { id: "poisoner", name: "🧪 Отравитель", description: "Каждую ночь: выберите игрока. Этот игрок отравлен текущей ночью и следующим днем" },
        { id: "harlot", name: "💋 Блудница", description: "Если живы хотя бы 5 игроков (Странники не считаются) и Демон умирает, вы становитесь Демоном"},
        { id: "baron", name: "🧬 Барон", description: "В игре присутствует большее число Изгоев. [+2 Изгоя]" },
        { id: "spy", name: "🥷 Шпион", description: "Каждую ночь: загляните в Гримуар. Вы можете определяться добрым и как Горожанин или Изгой, даже будучи мертвым"}
    ];

    let OUTCAST_POOL = [
        { id: "drunkard", name: "🍺 Пьяница", description: "Вы не знаете, что вы – Пьяница. Вы считаете себя определенным Горожанином"},
        { id: "butler", name: "🧤 Дворецкий", description: "Каждую ночь: выберите игрока (кроме себя). На следующий день вы можете голосовать, только если этот игрок тоже голосует"},
        { id: "recluse", name: "🚪 Затворник", description: "Вы можете определяться злым и как Приспешник или Демон, даже будучи мертвым"},
        { id: "saint", name: "✝️ Святой", description: "Если вы умираете в результате казни, ваша команда проигрывает"}
    ];

     let OUTCAST_POOL_WITHOUT_DRUNKARD = [
        { id: "butler", name: "🧤 Дворецкий"},
        { id: "recluse", name: "🚪 Затворник"},
        { id: "saint", name: "✝️ Святой"}
    ];

    let CITIZEN_POOL = [
        { id: "laundry", name: "🧼 Прачка", description: "Вступление: вы узнаете, что один из двух игроков является определенным Горожанином" },
        { id: "librarian", name: "📚 Библиотекарь", description: "Вступление: вы узнаете, что один из двух игроков является определенным Изгоем или что в игре отсутствуют Изгои" },
        { id: "detective", name: "🔍 Сыщик", description: "Вступление: вы узнаете, что один из двух игроков является определенным Приспешником" },
        { id: "cook", name: "🍲 Повар", description: "Вступление: вы узнаете, сколько пар сидящих рядом злых игроков присутствует в игре" },
        { id: "empath", name: "❤️ Эмпат", description: "Каждую ночь: вы узнаете число злых игроков среди двух ваших живых соседей" },
        { id: "fortune-teller", name: "🔮 Гадалка", description: "Каждую ночь: выберите двух игроков. Вы узнаете, есть ли среди них Демон. Один из добрых игроков определяется вами как Демон" },
        { id: "undertaker", name: "⚰️ Гробовщик", description: "Каждую ночь✳: вы узнаете роль игрока, умершего в результате казни прошедшим днем" },
        { id: "monk", name: "🙏 Монах", description: "Каждую ночь✳: выберите игрока (кроме себя). Этот игрок защищен от Демона текущей ночью" },
        { id: "raven-keeper", name: "🐦‍⬛ Смотритель воронов", description: "Если вы умираете ночью, вы просыпаетесь: выберите игрока. Вы узнаете его роль" },
        { id: "virgin", name: "🌸 Девственница", description: "Первый раз, когда вас номинируют, если номинирующий – Горожанин, его немедленно казнят" },
        { id: "fighter", name: "⚔️ Истребитель", description: "Один раз за игру, днем: публично выберите игрока. Если этот игрок – Демон, он умирает"},
        { id: "soldier", name: "🛡️ Солдат", description: "Вы защищены от Демона" },
        { id: "mayor", name: "👑 Мэр", description: "Если в живых осталось 3 игрока и не происходит казни, ваша команда побеждает. Если вы умираете ночью, вместо вас может умереть другой игрок" }
    ];

    // --------------------------------------------------------------
    // 3. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    // --------------------------------------------------------------
    function getRandomItem(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function getRandomUniqueItems(arr, count) {
        if (count > arr.length) count = arr.length;
        const shuffled = shuffleArray([...arr]);
        return shuffled.slice(0, count);
    }

    // --------------------------------------------------------------
    // 4. ЛОГИКА БАРОНА
    // --------------------------------------------------------------
    function applyBaronEffect(counts) {
        let { citizens, outcasts, servants, demon } = counts;
        citizens -= 2;
        outcasts += 2;
        return { citizens, outcasts, servants, demon };
    }

    // --------------------------------------------------------------
    // 5. ГЕНЕРАЦИЯ ТРЁХ ЖЕТОНОВ ДЛЯ ЧЁРТА
    // --------------------------------------------------------------
    function generateDemonTokens(rolesInGame) {
        // Полный пул всех возможных ролей (для жетонов черта)
        let ALL_POSSIBLE_ROLES = [...CITIZEN_POOL, ...OUTCAST_POOL_WITHOUT_DRUNKARD];

        ALL_POSSIBLE_ROLES = ALL_POSSIBLE_ROLES.filter(role => 
            !rolesInGame.some(r => r.id === role.id)
        );
        
        let selectedTokens = [];
        let attempts = 0;
        while (selectedTokens.length < 3) {
            selectedTokens = getRandomUniqueItems(ALL_POSSIBLE_ROLES, 3);
            
            // Правило 1: максимум 1 изгой среди показанных
            const outcastTokens = selectedTokens.filter(token => 
                OUTCAST_POOL_WITHOUT_DRUNKARD.some(o => o.id === token.id)
            );
            
            if (outcastTokens.length > 1) {
                selectedTokens = [];
                continue;
            }
        }
        
        return selectedTokens;
    }

    // --------------------------------------------------------------
    // 6. ГЕНЕРАЦИЯ ИЗГОЕВ
    // --------------------------------------------------------------
    function generateOutcasts(outcastsNeeded) {
        if (outcastsNeeded === 0) return { outcastsRoles: [], hasDrunkardAmongOutcasts: false };
        
        const outcastsRoles = getRandomUniqueItems(OUTCAST_POOL, outcastsNeeded);
        const hasDrunkardAmongOutcasts = outcastsRoles.some(r => r.id === "drunkard");
        
        return { outcastsRoles, hasDrunkardAmongOutcasts };
    }

    // --------------------------------------------------------------
    // 7. ГЕНЕРАЦИЯ ЭФФЕКТОВ (С УЧЁТОМ, ЧТО ПЬЯНИЦУ НЕЛЬЗЯ ВЫБИРАТЬ)
    // --------------------------------------------------------------
    
    // Прачка: исключаем пьяницу (если он есть) из списка доступных для выбора игроков
    function generateWasherwomanEffect(availablePlayers, citizenRoles, leftCitizenPool) {        
        let players = shuffleArray([...availablePlayers]);
        let player1 = players[0];
        let player2 = players[1];
     
        let hasCitizen = [player1, player2].some(p => 
            citizenRoles.some(r => r.id === p.id || p.id === 'spy')
        );
        
        if (!hasCitizen) {
            player2 = getRandomItem(citizenRoles);              
        }

        let shownPlayer = [player1, player2].find(p =>
            citizenRoles.some(role => role.id === p.id)
        );

        // Если среди игроков есть шпион, то показываем либо роль горожанина, которого нет в игре
        // либо роль второго игрока
        if(player1.id === 'spy' || player2.id === 'spy') {
            shownPlayer = getRandomItem([...leftCitizenPool, shownPlayer]);
        }
        
        return {
            player1: player1,
            player2: player2,
            shownRole: shownPlayer
        };
    }

    function generateLibrarianEffect(availablePlayers, outcastsRoles, leftOutcastPool) {
        if (outcastsRoles.length === 0) return { message:"нет изгоев" };
        
        let players = shuffleArray([...availablePlayers]);
        let player1 = players[0];
        let player2 = players[1];

        const hasOutcast = [player1, player2].some(p => outcastsRoles.includes(p));
        
        if (!hasOutcast) {
            const randomOutcast = getRandomItem(outcastsRoles);
            player2 = randomOutcast;
        }
        
        let shownPlayer = [player1, player2].find(p =>
            outcastsRoles.some(role => role.id === p.id)
        );

        // Если среди игроков есть шпион, то показываем либо роль изгоя, которого нет в игре
        // либо роль второго игрока
        if(player1.id === 'spy' || player2.id === 'spy') {
            shownPlayer = getRandomItem([...leftOutcastPool, shownPlayer]);
        }
        
        return {
            player1: player1,
            player2: player2,
            shownRole: shownPlayer
        };
    }

    function generateInvestigatorEffect(availablePlayers, servantsRoles, leftServantsPool) {
        if (servantsRoles.length === 0) return { message: "нет приспешников" };
        
        let players = shuffleArray([...availablePlayers]);
        let player1 = players[0];
        let player2 = players[1];
        
        const hasServant = [player1, player2].some(p => 
            servantsRoles.some(r => r.id === p.id)
        );
        
        if (!hasServant) {
            player2 = getRandomItem(servantsRoles);
        }
        
        let shownPlayer = [player1, player2].find(p =>
            servantsRoles.some(role => role.id === p.id)
        );

        // Если среди игроков есть затворник, то показываем либо роль приспешника, которого нет в игре
        // либо роль второго игрока
        if(player1.id === 'recluse' || player2.id === 'recluse') {
            shownPlayer = getRandomItem([...leftServantsPool, shownPlayer]);
        }
        
        return {
            player1: player1,
            player2: player2,
            shownRole: shownPlayer
        };
    }

    function generateFortuneTellerEffect(fortuneTellerTargets) {
        if (fortuneTellerTargets.length === 0) return { targetRole: "нет целей" };
        const target = getRandomItem(fortuneTellerTargets);
        return { targetRole: target };
    }

    // --------------------------------------------------------------
    // 8. ГЕНЕРАЦИЯ СЛУЧАЙНОГО СОСТАВА
    // --------------------------------------------------------------
    function generateRandomSetup(playersCount) {
        if (!ROLE_COUNTS[playersCount]) return null;

        let counts = { ...ROLE_COUNTS[playersCount] };

        const servantsNeeded = counts.servants;
        const servantsRoles = getRandomUniqueItems(SERVANT_POOL, servantsNeeded);

        if (servantsRoles.some(role => role.id === "baron")) {
            counts = applyBaronEffect(counts);
        }

        const outcastsNeeded = counts.outcasts;
        let outcastsRoles;
        let hasDrunkardAmongOutcasts;
   
        ({ outcastsRoles, hasDrunkardAmongOutcasts } = generateOutcasts(outcastsNeeded));
        
        //Если горожанин 1 то исключаем прачку из игроков, так как ей некого будет показывать
        let citizensNeeded = counts.citizens;
        if(citizensNeeded === 1) {
            CITIZEN_POOL = CITIZEN_POOL.filter(c => c.id !== "laundry");
        }
        
        let citizensRoles = getRandomUniqueItems(CITIZEN_POOL, citizensNeeded);
        
        let drunkardRole = null;
        if (hasDrunkardAmongOutcasts && citizensRoles.length > 0) {
            const leftCitizenPool = CITIZEN_POOL.filter(c => 
                !citizensRoles.some(role => role.id === c.id)
            );
            const extraCitizen = getRandomItem(leftCitizenPool);
            citizensRoles.push(extraCitizen);
            
            drunkardRole = getRandomItem(citizensRoles);
        }

         // Собираем ВСЕ роли, которые есть в игре (для жетонов черта)
        const rolesInGame = [...outcastsRoles, ...citizensRoles];

        // Генерируем три жетона для Чёрта
        const demonTokens = generateDemonTokens(rolesInGame);

        // Собираем ВСЕХ игроков для выбора целей
        const allPlayers = [DEMON, ...servantsRoles, ...outcastsRoles, ...citizensRoles];
       
        // Генерируем эффекты для особых горожан (с учётом пьяницы)
        const effects = {};
        let availablePlayers = {};
        
        for (let citizen of citizensRoles) {
            if (citizen.id === "laundry") {
                  // Убираем саму прачку и пьяницу, так как у нас уже лежит игрок(пьяница) в availablePlayers
                  availablePlayers = allPlayers.filter(p => p.id !== "laundry" && p.id !== "drunkard");
                  const leftCitizenPool = CITIZEN_POOL
                    .filter(role => 
                        !citizensRoles.some(r => r.id === role.id)
                    )
                    .filter(role => 
                        !demonTokens.some(r => r.id === role.id)
                    );
                  effects["laundry"] = generateWasherwomanEffect(availablePlayers, citizensRoles, leftCitizenPool);
            }

            if (citizen.id === "librarian") {
                availablePlayers = allPlayers;
                if(drunkardRole !== null) {
                    //Убираем игрока, который является пьяницей, самого пьяницу оставляем
                    availablePlayers = availablePlayers.filter(role => role.id !== drunkardRole.id);
                }
                //Убираем библиотекаря
                availablePlayers = availablePlayers.filter(p => p.id !== "librarian");

                const leftOutcastPool = OUTCAST_POOL
                    .filter(role => 
                        !outcastsRoles.some(r => r.id === role.id)
                    )
                    .filter(role => 
                        !demonTokens.some(r => r.id === role.id)
                    );

                effects["librarian"] = generateLibrarianEffect(availablePlayers, outcastsRoles, leftOutcastPool);
            }

            if (citizen.id === "detective") {
                // Исключаем самого сыщика
                availablePlayers = allPlayers.filter(p => p.id !== "detective");

                const leftServantsPool = SERVANT_POOL
                    .filter(role => 
                        !servantsRoles.some(r => r.id === role.id)
                    );

                //TODO добавить логику затворника
                effects["detective"] = generateInvestigatorEffect(availablePlayers, servantsRoles, leftServantsPool);
            }

            if (citizen.id === "fortune-teller") {
                //Убираем пьяницу, так как у нас есть игрок-пьяница
                outcastsRoles = outcastsRoles.filter(role => role.id !== "drunkard");
                const fortuneTellerTargets = [...citizensRoles, ...outcastsRoles];
                effects["fortune-teller"] = generateFortuneTellerEffect(fortuneTellerTargets);
            }
        }

        return {
            DEMON,
            servantsRoles,
            outcastsRoles,
            citizensRoles,
            drunkardRole,
            hasDrunkard: hasDrunkardAmongOutcasts,
            effects,
            demonTokens
        };
    }

    // --------------------------------------------------------------
    // 9. ОТРИСОВКА UI
    // --------------------------------------------------------------
    function renderResult(setup) {
        if (!setup) return;

        document.getElementById('demonList').innerHTML = `<div class="role-tag">${setup.DEMON.name}</div>`;

        const servantsHtml = setup.servantsRoles.map(o => `<div class="role-tag"><strong>${o.name}</strong> <em style="color:grey">(${o.description})</em></div>`).join('');
        document.getElementById('servantList').innerHTML = servantsHtml || '<div class="role-tag">—</div>';
        
        const outcastsHtml = setup.outcastsRoles.map(o => `<div class="role-tag"><strong>${o.name}</strong> <em style="color:grey">(${o.description})</em></div>`).join('');
        document.getElementById('outcastList').innerHTML = outcastsHtml || '<div class="role-tag">—</div>';
        
        const citizensContainer = document.getElementById('citizenList');
        citizensContainer.innerHTML = '';
        
        setup.citizensRoles.forEach(citizen => {
            const card = document.createElement('div');
            card.className = 'citizen-card';
            
            let displayName = citizen.name;
            if (setup.hasDrunkard && setup.drunkardRole.id === citizen.id) {
                displayName = `🍺 ${displayName} (пьяница)`;
                card.style.borderColor = '#e6a017';
                card.style.background = '#fff9ef';
            }
            
            let effectHtml = '';
            const effect = setup.effects[citizen.id];
            if (effect) {
                if (citizen.id === "laundry") {
                    effectHtml = `<div class="citizen-effect">🎭 Выбраны игроки: ${effect.player1.name} и ${effect.player2.name}. Показан жетон: ${effect.shownRole.name}</div>`;
                } else if (citizen.id === "librarian") {
                    if(effect.message != null) {
                       effectHtml = `<div class="citizen-effect">📖  ${effect.message}</div>`;       
                    } else {
                        effectHtml = `<div class="citizen-effect">📖 Выбраны игроки: ${effect.player1.name} и ${effect.player2.name}. Показан жетон: ${effect.shownRole.name}</div>`;
                    }
                } else if (citizen.id === "detective") {
                    if(effect.message != null) {
                       effectHtml = `<div class="citizen-effect">🕵️  ${effect.message}</div>`;       
                    } else {
                       effectHtml = `<div class="citizen-effect">🕵️ Выбраны игроки: ${effect.player1.name} и ${effect.player2.name}. Показан жетон: ${effect.shownRole.name}</div>`;
                    }
                } else if (citizen.id === "fortune-teller") {
                    effectHtml = `<div class="citizen-effect">🌀 Метка «ложный след» поставлена на ${effect.targetRole.name}.</div>`;
                }
            }
            
            card.innerHTML = `
                <div class="citizen-name"><strong>${displayName}</strong> <em style="color:grey">(${citizen.description})</em></div>
                ${effectHtml}
            `;
            citizensContainer.appendChild(card);
        });
        
        // Отображаем жетоны для Чёрта
        const tokensContainer = document.getElementById('demonTokens');
        tokensContainer.innerHTML = setup.demonTokens.map(token => `<div class="token">${token.name}</div>`).join('');
        
        document.getElementById('resultContainer').style.display = 'block';
    }

    function generateAndShow() {
        const input = document.getElementById('playersInput');
        let players = parseInt(input.value, 10);
        if (isNaN(players)) players = 10;
        if (players < 5) players = 5;
        if (players > 15) players = 15;
        input.value = players;
        
        const setup = generateRandomSetup(players);
        if (setup) {
            renderResult(setup);
        } else {
            alert('Ошибка генерации состава');
        }
    }

    // --------------------------------------------------------------
    // 10. ИНИЦИАЛИЗАЦИЯ
    // --------------------------------------------------------------
    document.getElementById('generateBtn').addEventListener('click', generateAndShow);
    document.getElementById('randomBtn').addEventListener('click', generateAndShow);

    generateAndShow();
</script>
</body>
</html>
